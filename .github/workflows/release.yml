name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - name: Test registration and update validation
        shell: pwsh
        run: .\scripts\test-release.ps1 -NoUI
      - name: Test in-place update and rollback
        shell: pwsh
        run: .\scripts\test-updater.ps1
      - name: Fetch pinned video runtime
        shell: pwsh
        run: .\scripts\fetch-video-runtime.ps1
      - name: Build portable ZIP
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Verify portable archive
        shell: pwsh
        run: .\scripts\test-portable.ps1
      - name: Verify packaged upgrade from 0.2.3
        shell: pwsh
        run: .\scripts\test-packaged-update.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LumaView-Windows
          path: |
            dist/LumaView-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create $env:GITHUB_REF_NAME "dist/LumaView-$version-win-x64.zip" dist/SHA256SUMS.txt --draft --verify-tag --title "LumaView $version (ZIP)" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
