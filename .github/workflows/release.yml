name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - name: Test registration and update validation
        shell: pwsh
        run: .\scripts\test-release.ps1 -NoUI
      - name: Prepare installer compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup hash mismatch' }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Inno Setup signature mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$compilerRoot+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup install failed' }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer and portable ZIP
        shell: pwsh
        run: .\scripts\package.ps1 -InnoCompiler $env:INNO_COMPILER
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\scripts\test-installer.ps1 -SetupPath "dist/LumaView-Setup-$version-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LumaView-Windows
          path: |
            dist/LumaView-Setup-*-x64.exe
            dist/LumaView-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create $env:GITHUB_REF_NAME "dist/LumaView-Setup-$version-x64.exe" "dist/LumaView-$version-win-x64.zip" dist/SHA256SUMS.txt --draft --verify-tag --title "LumaView $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
