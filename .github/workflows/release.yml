name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - name: Build native Explorer thumbnail provider
        shell: pwsh
        run: .\shell-thumbnail\rebuild.ps1
      - name: Test registration and update validation
        shell: pwsh
        run: .\scripts\test-release.ps1 -NoUI
      - name: Test in-place update and rollback
        shell: pwsh
        run: .\scripts\test-updater.ps1
      - name: Test language and theme selection
        shell: pwsh
        run: .\scripts\test-settings-interaction.ps1
      - name: Fetch pinned video runtime
        shell: pwsh
        run: .\scripts\fetch-video-runtime.ps1
      - name: Build installer and portable ZIPs
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and !(Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          .\scripts\package.ps1 -CleanPortable -IncludeInstaller
          .\scripts\package.ps1
      - name: Verify installation, associations and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\scripts\test-installer.ps1 -SetupPath "dist\DollView-Setup-$version-x64.exe"
      - name: Verify portable archive
        shell: pwsh
        run: .\scripts\test-portable.ps1
      - name: Verify 3D format conversion
        shell: powershell
        run: .\scripts\test-model-conversion.ps1 -AppDirectory ((Get-Content dist\latest-payload.txt -Raw).Trim())
      - name: Verify legacy and DollView ZIP updates
        shell: pwsh
        run: .\scripts\test-packaged-update.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LumaView-Windows
          path: |
            dist/LumaView-*-win-x64.zip
            dist/DollView-*-win-x64.zip
            dist/DollView-Setup-*-x64.exe
            dist/SHA256SUMS.txt
            dist/DollView-SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create $env:GITHUB_REF_NAME "dist/DollView-Setup-$version-x64.exe" "dist/DollView-$version-win-x64.zip" dist/DollView-SHA256SUMS.txt "dist/LumaView-$version-win-x64.zip" dist/SHA256SUMS.txt --draft --verify-tag --title "DollView $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
